# One-command Postgres for testing the server against a real database.
#   docker compose up -d
#   export DATABASE_URL=postgres://trinity:trinity@localhost:5432/trinity
#   python server.py
#
# Omit this entirely to just run the seeded SQLite demo.
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: trinity
      POSTGRES_PASSWORD: trinity
      POSTGRES_DB: trinity
    ports:
      - "5432:5432"
    volumes:
      - trinity_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trinity"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  trinity_pg:
