name: Deploy to Railway

# Deploys the static site service (Dockerfile + Caddy) to Railway on every push
# to this branch. Requires ONE repository secret:
#   RAILWAY_TOKEN  — create at railway.com → Account Settings → Tokens,
#                    then add in GitHub → Settings → Secrets → Actions.
# Until the secret exists, the workflow skips gracefully instead of failing.

on:
  push:
    branches:
      - claude/niche-website-10k-revenue-1HO4j
      - main
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for RAILWAY_TOKEN
        id: token
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          if [ -z "$RAILWAY_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::RAILWAY_TOKEN secret is not set — skipping deploy. Add it in Settings → Secrets → Actions."
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Railway CLI
        if: steps.token.outputs.present == 'true'
        run: npm i -g @railway/cli

      - name: Deploy
        if: steps.token.outputs.present == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --ci --service agentic-os || railway up --ci
